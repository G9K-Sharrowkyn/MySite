services:
  backend:
    build: ./backend
    container_name: nerdsite-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NODE_ENV=development
      - PORT=5000
      - DATABASE=local
      - JSON_DB_PATH=db.json
      # - MONGO_URI=mongodb://mongo:27017
      # - MONGO_DB_NAME=geekfights
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm start

  frontend:
    build: .
    container_name: nerdsite-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    command: npm start


