name: Quality Gate

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm run test:ci
      - name: Build production frontend
        run: npm run build
      - name: Audit Swoop Racing dependencies
        run: npm audit --prefix SR --omit=dev --audit-level=high
      - name: Lint Swoop Racing
        run: npm --prefix SR run lint
      - name: Test Swoop Racing
        run: npm --prefix SR test

  backend:
    name: Backend and concurrency regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Audit production backend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run concurrent CRUD regression tests
        run: npm run test:regression
      - name: Run complete backend test suite
        run: npm run test:ci

  browser:
    name: Playwright browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run complete Playwright regression suite
        run: npm run test:e2e:ci
      - name: Upload Playwright report and failure traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
