<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cyberpunk terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }

    html, body {
      height: 100%; overflow: hidden;
      background: linear-gradient(0deg, #000 0%, #280604 100%);
      color: rgba(255,85,78,1);
      font-family: "Chakra Petch", "Courier New", monospace;
      font-size: clamp(18px, 1.2vw, 28px);
      font-weight: 500;
      user-select: none;
    }

    /* ── CRT turn-on (szarpane przejście) ── */
    .container { position: relative; width: 100%; height: 100%; }

    .container.on > .screen {
      animation: turn-on 2s linear;
      animation-fill-mode: forwards;
    }

    @keyframes turn-on {
      0%  { transform: scale(1,.8)        translate3d(0,0,0);      opacity:1; }
      5%  { transform: scale(1.09139,1.34235) translate3d(0,100%,0); }
      10% { transform: scale(.63084,1.40698)  translate3d(0,-100%,0); }
      15% { transform: scale(.75142,1.34118)  translate3d(0,100%,0); }
      20% { transform: scale(.96173,1.36858)  translate3d(0,-100%,0); }
      25% { transform: scale(1.1348,1.02729)  translate3d(0,100%,0); }
      30% { transform: scale(.97038,.71092)   translate3d(0,-100%,0); }
      35% { transform: scale(.6067,1.31101)   translate3d(0,100%,0); }
      40% { transform: scale(.786,.9326)      translate3d(0,-100%,0); }
      45% { transform: scale(1.38602,1.14399) translate3d(0,100%,0); }
      50% { transform: scale(.69973,.90412)   translate3d(0,-100%,0); }
      51% { transform: scale(1,1)             translate3d(0,0,0);
            filter: brightness(1) saturate(1); opacity:0; }
      100%{ transform: scale(1,1)             translate3d(0,0,0);
            filter: contrast(1) brightness(1.2) saturate(1.3); opacity:1; }
    }

    /* ── Scanlines only (no flicker) ── */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 200; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
        transparent 1px, transparent 3px
      );
    }

    /* ── Full-screen wrapper ── */
    .screen {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Terminal box — styled like stage 1 breachBox ── */
    .term-box {
      background: rgba(0,0,0,0.4);
      border: 2px solid rgb(255,85,78);
      border-left: 10px solid rgb(255,85,78);
      padding: 2rem 2.5rem;
      width: 90%; max-width: 1100px;
      filter: drop-shadow(0 0 10px rgba(255,85,78,1));
    }

    /* ── Heading ── */
    .term-heading {
      font-size: 1.8em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(255,85,78,0.4);
      padding-bottom: 0.6em;
      margin-bottom: 1.4em;
      filter: drop-shadow(0 0 10px rgba(255,85,78,1));
    }

    /* ── Description ── */
    .term-desc {
      font-size: 0.75em;
      opacity: 0.7;
      text-align: left;
      margin-bottom: 1.6em;
      line-height: 1.6;
      letter-spacing: 0.04em;
    }
    .term-desc b { font-weight: 600; opacity: 1; }

    /* ── Rows ── */
    .term-row {
      display: flex; align-items: center;
      gap: 1em; margin: 0.7em 0;
      font-size: 0.85em;
    }
    .term-lbl {
      min-width: 9.2em;
      flex: 0 0 9.2em;
      opacity: 0.65;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.9em;
    }
    .term-inp {
      flex: 1;
      background: rgba(255,85,78,0.06);
      border: 1px solid rgba(255,85,78,0.4);
      color: rgba(255,85,78,1);
      font-family: inherit; font-size: inherit;
      font-weight: 500;
      padding: 0.4em 0.7em;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .term-inp:focus {
      border-color: rgba(255,85,78,1);
      box-shadow: 0 0 8px rgba(255,85,78,0.5);
    }
    body, body * {
      user-select: none;
      -webkit-user-select: none;
    }
    .term-inp::placeholder { color: rgba(255,85,78,0.3); }
    #t-login { user-select: none; -webkit-user-select: none; pointer-events: none; }
    .term-pass-shell {
      position: relative;
      flex: 1;
    }
    .term-pass-shell .term-inp {
      width: 100%;
      color: transparent;
      caret-color: transparent;
      text-shadow: none;
      position: relative;
      z-index: 1;
      user-select: none;
      -webkit-user-select: none;
    }
    .term-pass-mask {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
      pointer-events: none;
      padding: 0.4em 0.7em;
      color: #77e2f2;
      font-family: inherit;
      font-size: inherit;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-shadow: 0 0 8px rgba(119,226,242,0.65);
      white-space: pre;
    }
    .term-pass-mask.is-empty {
      letter-spacing: 0.08em;
    }
    .term-pass-mask.is-placeholder {
      color: rgba(119,226,242,0.28);
      text-shadow: 0 0 7px rgba(119,226,242,0.18);
      animation: term-placeholder-glitch 0.22s steps(2) infinite;
    }
    .term-pass-mask.is-focused::after,
    .term-pass-mask.has-value::after {
      content: '';
      width: 1px;
      height: 1.1em;
      margin-left: 0.18em;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: term-caret 0.8s steps(1) infinite;
    }
    .term-pass-mask.has-hidden {
      animation: term-mask-glitch 0.18s steps(2) infinite;
    }
    @keyframes term-caret { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes term-mask-glitch {
      0% { transform: translate(0, 0); }
      50% { transform: translate(0.08em, -0.02em); }
      100% { transform: translate(-0.05em, 0.03em); }
    }
    @keyframes term-placeholder-glitch {
      0% { transform: translate(0, 0); opacity: 0.6; }
      50% { transform: translate(0.05em, 0); opacity: 0.85; }
      100% { transform: translate(-0.04em, 0.02em); opacity: 0.68; }
    }

    /* ── Submit button — cyan like breach button in stage 1 ── */
    .term-submit {
      display: block;
      margin: 1.4em auto 0;
      padding: 0.45em 2.2em;
      border: 1px solid rgba(255,85,78,1);
      background: rgba(255,85,78,0.08);
      color: #77e2f2;
      font-family: inherit; font-size: 0.85em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: background .2s, box-shadow .2s;
      filter: drop-shadow(0 0 6px rgba(255,85,78,0.6));
    }
    .term-submit:hover {
      background: rgba(255,85,78,0.15);
      box-shadow: 0 0 14px rgba(255,85,78,0.8);
    }

    /* ── Status line ── */
    .term-status {
      text-align: center;
      margin-top: 0.8em;
      font-size: 0.75em;
      letter-spacing: 0.1em;
      min-height: 1.4em;
    }
    .term-status.ok {
      color: #77e2f2;
      filter: drop-shadow(0 0 8px #77e2f2);
      animation: tblink .25s steps(1) 4;
    }
    @keyframes tblink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>

<body>
  <div class="container on">
    <div class="screen">
      <div class="term-box">
        <div class="term-heading">NEXUS LINK ESTABLISHED</div>
        <p class="term-desc">
          Welcome to <b>VERSUS//VAULT</b> — Battle data nexus.<br>
          Enter NETRUNNER credentials to proceed.
        </p>
        <div class="term-row">
          <span class="term-lbl">Login</span>
          <input class="term-inp" id="t-login" type="text" readonly>
        </div>
        <form id="auth-form">
          <div class="term-row">
            <span class="term-lbl">Password</span>
            <div class="term-pass-shell">
              <input class="term-inp" id="t-pass" type="text"
                maxlength="32" placeholder="" autocomplete="off" spellcheck="false" data-form-type="other">
              <div class="term-pass-mask is-empty" id="t-pass-mask">________</div>
            </div>
          </div>
          <div class="term-status" id="t-status">&nbsp;</div>
          <button class="term-submit" type="submit">[ AUTHENTICATE ]</button>
        </form>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const termLang = (() => {
      try {
        const params = new URLSearchParams(window.location.search);
        const raw = (params.get('lang') || '').trim().toLowerCase();
        if (raw === 'pl' || raw === 'en') return raw;
      } catch (error) {}
      try {
        const stored = (localStorage.getItem('vvv-app-language-v1') || '').trim().toLowerCase();
        if (stored === 'pl' || stored === 'en') return stored;
      } catch (error) {}
      return 'en';
    })();

    const COPY = termLang === 'pl'
      ? {
          heading: 'POŁĄCZENIE NEXUS AKTYWNE',
          termLine1: 'Witaj w <b>VERSUS//VAULT</b> - bojowym węźle danych.<br>',
          termLine2: 'Wprowadź dane NETRUNNERA, aby kontynuować.',
          loginLabel: 'Użytkownik',
          passwordLabel: 'Hasło',
          authButton: '[ AUTORYZUJ ]',
          passPlaceholder: 'PASS NETRUNNERA',
          passwordRequired: 'HASŁO WYMAGANE',
          authenticating: 'AUTORYZACJA...',
          clearanceVerified: 'DOSTĘP NADANY — G9K_Rubikon',
        }
      : {
          heading: 'NEXUS LINK ESTABLISHED',
          termLine1: 'Welcome to <b>VERSUS//VAULT</b> — Battle data nexus.<br>',
          termLine2: 'Enter NETRUNNER credentials to proceed.',
          loginLabel: 'Login',
          passwordLabel: 'Password',
          authButton: '[ AUTHENTICATE ]',
          passPlaceholder: 'NETRUNNER PASS',
          passwordRequired: 'PASSWORD REQUIRED',
          authenticating: 'AUTHENTICATING...',
          clearanceVerified: 'CLEARANCE VERIFIED — G9K_Rubikon',
        };

    document.documentElement.lang = termLang;

    const loginEl  = document.getElementById('t-login');
    const passEl   = document.getElementById('t-pass');
    const passMask = document.getElementById('t-pass-mask');
    const statusEl = document.getElementById('t-status');
    const authForm = document.getElementById('auth-form');
    const headingEl = document.querySelector('.term-heading');
    const termDescEl = document.querySelector('.term-desc');
    const loginRowEl = loginEl ? loginEl.closest('.term-row') : null;
    const passwordRowEl = passEl ? passEl.closest('.term-row') : null;
    const loginLabelEl = loginRowEl ? loginRowEl.querySelector('.term-lbl') : null;
    const passwordLabelEl = passwordRowEl ? passwordRowEl.querySelector('.term-lbl') : null;
    const authButtonEl = document.querySelector('.term-submit');

    if (headingEl) headingEl.textContent = COPY.heading;
    if (termDescEl) termDescEl.innerHTML = COPY.termLine1 + COPY.termLine2;
    if (loginLabelEl) loginLabelEl.textContent = COPY.loginLabel;
    if (passwordLabelEl) passwordLabelEl.textContent = COPY.passwordLabel;
    if (authButtonEl) authButtonEl.textContent = COPY.authButton;

    const PASSWORD_POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@$%#&*';
    const MAX_PASS_LEN = 32;
    const HIDE_DELAY_MS = 1500;
    const SCRAMBLE_STEP_MS = 70;
    let passTokens = [];
    let passFrame = 0;

    const renderPassMask = (now = performance.now()) => {
      let display = '';
      let hasHidden = false;
      const isFocused = document.activeElement === passEl;
      const isEmpty = passTokens.length === 0;

      for (let idx = 0; idx < passTokens.length; idx += 1) {
        const token = passTokens[idx];
        const age = now - token.createdAt;

        if (age >= HIDE_DELAY_MS) {
          display += '#';
          hasHidden = true;
          continue;
        }

        const phase = Math.floor(age / SCRAMBLE_STEP_MS);
        const poolIndex = (token.seed + phase * 7 + idx * 13) % PASSWORD_POOL.length;
        display += PASSWORD_POOL[poolIndex];
      }

      if (isEmpty) {
        display = isFocused ? '' : COPY.passPlaceholder;
      }

      passMask.textContent = display;
      passMask.classList.toggle('is-empty', isEmpty);
      passMask.classList.toggle('is-placeholder', isEmpty && !isFocused);
      passMask.classList.toggle('has-value', !isEmpty);
      passMask.classList.toggle('has-hidden', hasHidden);
      passMask.classList.toggle('is-focused', isFocused);
      passEl.value = passTokens.length ? '#'.repeat(passTokens.length) : '';
      if (typeof passEl.setSelectionRange === 'function') {
        const end = passEl.value.length;
        passEl.setSelectionRange(end, end);
      }
    };

    const tickPassMask = () => {
      renderPassMask();
      passFrame = window.requestAnimationFrame(tickPassMask);
    };

    const startPassMask = () => {
      if (!passFrame) {
        passFrame = window.requestAnimationFrame(tickPassMask);
      }
    };

    const lockPassSelection = () => {
      if (typeof passEl.setSelectionRange === 'function') {
        const end = passEl.value.length;
        passEl.setSelectionRange(end, end);
      }
    };

    const syncPassFocus = () => {
      passMask.classList.toggle('is-focused', document.activeElement === passEl);
    };

    const pushPassToken = (count = 1) => {
      if (passTokens.length >= MAX_PASS_LEN || count <= 0) return;
      const now = performance.now();

      passTokens = passTokens.map(() => ({
        createdAt: now,
        seed: Math.floor(Math.random() * PASSWORD_POOL.length)
      }));

      for (let idx = 0; idx < count; idx += 1) {
        if (passTokens.length >= MAX_PASS_LEN) break;
        passTokens.push({
          createdAt: now,
          seed: Math.floor(Math.random() * PASSWORD_POOL.length)
        });
      }

      renderPassMask(now);
    };

    const popPassToken = () => {
      if (!passTokens.length) return;
      passTokens.pop();
      renderPassMask();
    };

    // ── auto-type login ───────────────────────────────────────────
    const LOGIN_TEXT = 'G9K_Rubikon';
    let i = 0;
    const typeLogin = () => {
      if (i < LOGIN_TEXT.length) {
        loginEl.value += LOGIN_TEXT[i++];
        setTimeout(typeLogin, 90 + Math.random() * 60);
      } else {
        passEl.focus({ preventScroll: true });
        syncPassFocus();
      }
    };
    // wait for turn-on animation to settle before typing
    renderPassMask();
    startPassMask();
    setTimeout(typeLogin, 2200);

    passEl.addEventListener('focus', syncPassFocus);
    passEl.addEventListener('blur', syncPassFocus);
    passEl.addEventListener('select', lockPassSelection);
    passEl.addEventListener('mouseup', lockPassSelection);
    passEl.addEventListener('pointerup', lockPassSelection);
    passEl.addEventListener('dragstart', e => e.preventDefault());
    passEl.addEventListener('keydown', e => {
      if (passEl.readOnly && e.key !== 'Tab') {
        e.preventDefault();
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        popPassToken();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        authForm.requestSubmit();
        return;
      }
      if (e.key.length === 1) {
        e.preventDefault();
        pushPassToken();
      }
    });
    passEl.addEventListener('paste', e => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData('text') || '';
      pushPassToken(pasted.length);
    });

    // ── pointer relay → parent chain (search/1.html → App.tsx) ───
    const relay = (kind, e, down) =>
      window.parent.postMessage(
        { type:'vvv-pointer-relay', source:'terminal', event:kind,
          x: e.clientX, y: e.clientY, down: !!down,
          timestamp: performance.now() },
        '*'
      );
    document.addEventListener('pointermove',   e => relay('move', e),        { passive:true });
    document.addEventListener('pointerdown',   e => relay('down', e, true),  { passive:true });
    document.addEventListener('pointerup',     e => relay('up',   e, false), { passive:true });
    document.addEventListener('pointercancel', e => relay('up',   e, false), { passive:true });
    document.addEventListener('pointerleave',  e => relay('leave',e, false), { passive:true });

    // ── form submit ───────────────────────────────────────────────
    authForm.addEventListener('submit', e => {
      e.preventDefault();
      if (!passTokens.length) {
        statusEl.textContent = COPY.passwordRequired;
        statusEl.className = 'term-status';
        passEl.focus();
        syncPassFocus();
        return;
      }
      passEl.readOnly = true;
      if (passFrame) {
        window.cancelAnimationFrame(passFrame);
        passFrame = 0;
      }
      passTokens = passTokens.map(token => ({
        createdAt: performance.now() - HIDE_DELAY_MS,
        seed: token.seed
      }));
      renderPassMask();
      statusEl.textContent = COPY.authenticating;
      statusEl.className = 'term-status';
      setTimeout(() => {
        statusEl.textContent = COPY.clearanceVerified;
        statusEl.className = 'term-status ok';
        setTimeout(() => {
          window.parent.postMessage({ type: 'vvv-terminal-submit' }, '*');
        }, 700);
      }, 900);
    });
  })();
  </script>
</body>
</html>
