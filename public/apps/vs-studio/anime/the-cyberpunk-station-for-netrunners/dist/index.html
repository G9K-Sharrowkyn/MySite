    <script>
    /* ── Mock dead nightfm-backend (Replit gone) + SoundCloud (no token) ── */
    (function () {
      function isBlocked(url) {
        var s = typeof url === 'string' ? url
              : (url && typeof url.url === 'string') ? url.url
              : (url && typeof url.toString === 'function') ? url.toString() : '';
        var sl = s.toLowerCase();
        return sl.includes('nightfm-backend') || sl.includes('soundcloud.com');
      }
      var blob = URL.createObjectURL(new Blob(['{}'], { type: 'application/json' }));
      var _open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, async, user, pass) {
        if (isBlocked(url)) url = blob;
        return async === undefined ? _open.call(this, method, url)
                                   : _open.call(this, method, url, async, user, pass);
      };
      var _fetch = window.fetch;
      window.fetch = function (url, opts) {
        if (isBlocked(url))
          return Promise.resolve(new Response('{}', { status: 200 }));
        return _fetch.call(this, url, opts);
      };
      window.addEventListener('unhandledrejection', function (e) { e.preventDefault(); });
    })();
    </script>

    window.addEventListener('keydown', function (event) {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
      if (!window.parent || window.parent === window) return;
      if (/^[1-4]$/.test(event.key)) {
        event.preventDefault();
        window.parent.postMessage(
          { type: 'vvv-dev-jump-stage-request', stage: Number(event.key) },
          window.location.origin
        );
        return;
      }
      if (!/^[5-9]$/.test(event.key)) return;
      event.preventDefault();
      window.parent.postMessage(
        { type: 'vvv-dev-open-fight-shortcut-request', key: event.key },
        window.location.origin
      );
    });
    </script>

      ];

      var breachPanel = [
        "KERNEL LOADOUT :: NULLROUTE PROFILE",
        "------------------------------------------------",
        "[0x001] PRIME       KERNEL-MUX                READY",
        "[0x002] LOAD        RELAY-THREAD              READY",
        "[0x003] LOAD        PACKET-STACK              READY",
        "[0x004] VERIFY      CHECKSUM-MATRIX           READY",
        "[0x005] TUNE        CACHE-FABRIC              READY",
        "[0x006] SYNC        IO-BACKPLANE              READY",
        "[0x007] ALIGN       PORT-MAPPER               READY",
        "[0x008] SHAPE       ROUTE-TABLE               READY",
        "[0x009] PATCH       PROXY-BUS                 READY",
        "[0x00A] CHARGE      THREAD-POOL               READY",
        "[0x00B] IGNITE      HYPERVISOR                READY",
        "[0x00C] REFRACT     TRACE-SHIELD              READY",
        "[0x00D] MARK        G9K_RUBIKON_SESSION       READY",
        "[0x00E] MOUNT       ARTEMIS_ARGO_INDEX        READY",
        "[0x00F] SELECT      PROJECT_ARES_RUNTIME      READY",
        "[0x010] BROADCAST   VERSUSVERSEVAULT_LINK     READY",
        "[0x011] STATUS      EXEC-WINDOW               READY",
        "------------------------------------------------",
        "VISUAL STATE : STABLE [NO PACKET LOSS]",
        "OPERATOR     : ORBITAL_WRAITH [ROOT VECTOR]",
        "------------------------------------------------"
      ].join("\n");

      var postSpecialLines = [
        "archive_ghost.sig :: braiding ARTEMIS_ARGO index ghost :: synced [0xB241]",
        "mantle_lock.sig :: seating PROJECT_ARES core mantle :: active [0xB5A2]",
        "halo_gate.sig :: resolving VERSUSVERSEVAULT edge halo :: online [0xB8C3]",
        "shadow_mirror.sig :: pinning G9K_RUBIKON mirror trace :: cached [0xBC14]",
        "archive_ghost.sig :: ARTEMIS_ARGO checksum veil :: clean [0xBF65]",
        "mantle_lock.sig :: PROJECT_ARES kernel braid :: mapped [0xC2D6]",
        "halo_gate.sig :: VERSUSVERSEVAULT packet halo :: stable [0xC607]",
        "shadow_mirror.sig :: G9K_RUBIKON token lattice :: indexed [0xC958]"
      ];

      var postStart = null;
      var buttonWasReady = false;
      var postClickLatch = false;
      var breachProgressTitle = "PROXY OVERRIDE";

      function isVisible(el) {
        if (!el) return false;
        var styles = window.getComputedStyle(el);
        return styles.display !== "none" &&
          styles.visibility !== "hidden" &&
          parseFloat(styles.opacity || "1") > 0.05;
      }

      function setText(el, value) {
        value = localizeStationText(value);
        if (el && el.textContent !== value) {
          el.textContent = value;
        }
      }

      function revealLocalizedStationUi() {
        document.documentElement.classList.remove("station-localizing");
      }

      function opacityOf(el) {
        if (!el) return 0;
        return parseFloat(window.getComputedStyle(el).opacity || "1");
      }

      function pick(list, index, stride) {
        return list[(index * stride) % list.length];
      }

      function hexToken(seed) {
        return (40960 + (seed * 977) % 20479).toString(16).toUpperCase();
      }

      function buildTagLabel(step) {
        return postTagSequence[step % postTagSequence.length];
      }

      function buildIconPanel(step) {
        var moduleA = postModules[step % postModules.length];
        var moduleB = postModules[(step * 2 + 3) % postModules.length];
        var moduleC = postModules[(step * 5 + 7) % postModules.length];
        var field = pick(postObjects, step, 7).replace(/ /g, "_");
        var renderId = moduleA + "_" + hexToken(step).toLowerCase();

        return moduleA + " >> " + moduleB + " >> " + moduleC + " >> signal_guard\n" +
          "field_map: " + field + " at 0x" + hexToken(step) + "\n" +
          "render: '__" + renderId + "'";
      }

      function buildPostLine(step) {
        if (step === 0) return "kernel render v13.4 :: NULLROUTE_WINDOW";
        if (step === 1) return "vault :: G9K_RUBIKON";
        if (step === 2) return "operator :: ORBITAL_WRAITH";
        if (step === 3) return "----------------------------------------";
        if (step === 4) return "";

        var phase = step - 5;
        if (phase > 0 && phase % 9 === 0) {
          return postSpecialLines[Math.floor(phase / 9) % postSpecialLines.length];
        }
        var module = pick(postModules, phase, 3);
        var object = pick(postObjects, phase, 7);
        var verb = pick(postVerbs, phase, 5);
        var state = pick(postStates, phase, 11);
        var via = pick(postModules, phase + 1, 5).replace(/_/g, "-");

        return module + ".sig :: " + verb + " " + object +
          " via " + via + " :: " + state +
          " [0x" + hexToken(phase) + "]";
      }

      function buildPostWindow(step, size) {
        var lines = [];
        var start = Math.max(0, step - size + 1);
        var i;

        for (i = start; i <= step; i += 1) {
          lines.push(buildPostLine(i));
        }

        return lines.join("\n");
      }

      function renderLoop() {
        var now = performance.now();
        var opening = document.querySelector(".openingBox");
        var secondary = document.querySelector(".secondaryCode");
        var tertiary = document.querySelector(".tertiaryCode");
        var button = document.querySelector(".breachButton");
        var box1 = document.querySelector(".breachBox1");
        var mainLog = document.querySelector(".breachProtocolBg pre");
        var panel = document.querySelector(".breachBox2 pre");
        var tag = document.querySelector(".breachBox1 a");
        var icon = document.querySelector(".breachIcon pre");
        var progressLabel = document.querySelector(".breachProgress") &&
          document.querySelector(".breachProgress").previousElementSibling;

        var box1Width = box1 ? box1.getBoundingClientRect().width : 0;
        if (box1Width >= 40 && !postClickLatch) {
          postClickLatch = true;
          if (opening)  opening.style.visibility  = 'hidden';
          if (secondary) secondary.style.visibility = 'hidden';
          if (tertiary) tertiary.style.visibility  = 'hidden';
          if (button)   button.style.visibility   = 'hidden';
        }
        var preClick = !postClickLatch && isVisible(secondary) && box1Width < 40;
        var buttonReady = isVisible(button) && opacityOf(button) > 0.85;

        if (preClick && !buttonReady) {
          var bootStart = Math.floor(now / 85) % bootLines.length;
          var bootWindow = [];
          var bootLength = Math.min(15, bootLines.length);
          var i;

          for (i = 0; i < bootLength; i += 1) {
            bootWindow.push(bootLines[(bootStart + i) % bootLines.length]);
          }

          var blockIndex = Math.floor(now / 520) % secondaryBlocks.length;
          var blockElapsed = now - Math.floor(now / 520) * 520;
          var lineCount = Math.min(secondaryBlocks[blockIndex].length, Math.floor(blockElapsed / 65));
          var blockLines = secondaryBlocks[blockIndex].slice(0, lineCount);
          while (blockLines.length < 11) blockLines.push('');

          setText(opening, bootWindow.join("\n"));
          setText(secondary, buildAlignedPanelBlock(blockLines));
          setText(tertiary, bannerTexts[blockIndex]);
          setText(progressLabel, breachProgressTitle);
          setText(button, buttonLabels[2]);
          revealLocalizedStationUi();
          postStart = null;
        }

        if (preClick && buttonReady) {
          setText(opening, "[  0.000024] all systems drift-ready");
          setText(secondary, buildAlignedPanelBlock(finalReadyBlock));
          setText(tertiary, finalBannerText);
          setText(progressLabel, breachProgressTitle);
          setText(button, buttonLabels[2]);
          revealLocalizedStationUi();
          postStart = null;
        }

        if (box1Width >= 40) {
          if (postStart === null) postStart = now;

          var elapsed = now - postStart;
          var logStep = Math.floor(elapsed / 42) + 1;
          var tagStep = Math.floor(elapsed / 320);
          var iconStep = Math.floor(elapsed / 220);

          setText(mainLog, buildPostWindow(logStep, 18));
          setText(panel, breachPanel);
          setText(tag, buildTagLabel(tagStep));
          setText(icon, buildIconPanel(iconStep));
          setText(progressLabel, breachProgressTitle);
          setText(button, buttonLabels[2]);
          revealLocalizedStationUi();
        }

        window.requestAnimationFrame(renderLoop);
      }

      window.addEventListener("load", function () {
        if (stationLang !== 'pl') {
          revealLocalizedStationUi();
        }
        window.requestAnimationFrame(renderLoop);
      });
    })();
    </script>
  </body>
  
</html>
